<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Oficial Pokemons House</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Configuração do Firebase (Mantenha a sua configuração original aqui)
        const firebaseConfig = {
            apiKey: "AIzaSyC2d-OT4XIyLG1O48gMexds4n5-MzvjAgE",
            authDomain: "pokemons-house.firebaseapp.com",
            projectId: "pokemons-house",
            storageBucket: "pokemons-house.firebasestorage.app",
            messagingSenderId: "249877855012",
            appId: "1:249877855012:web:e34e3b0c304b06b52fd1b1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const COLLECTION_NAME = "TradePokesOficial";
        const ADMIN_PASSWORD = "Shared@2026";

        let pendingAction = null;

        window.requestAdminAuth = function(actionCallback) {
            pendingAction = actionCallback;
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('authModal').classList.remove('hidden');
        }

        window.closeAuthModal = function() {
            pendingAction = null;
            document.getElementById('authModal').classList.add('hidden');
        }

        window.confirmAdminAuth = function() {
            const enteredPassword = document.getElementById('adminPasswordInput').value;
            if (enteredPassword === ADMIN_PASSWORD) {
                document.getElementById('authModal').classList.add('hidden');
                if (pendingAction) {
                    const action = pendingAction;
                    pendingAction = null;
                    action();
                }
            } else {
                alert("Senha incorreta!");
                document.getElementById('adminPasswordInput').value = '';
            }
        }

        window.currentData = {
            "Cloneds": [],
            "Shiny": [],
            "Raros": []
        };
        window.currentCategory = 'all';

        function listenToFirebase() {
            onSnapshot(collection(db, COLLECTION_NAME), (snapshot) => {
                const newData = { "Cloneds": [], "Shiny": [], "Raros": [] };
                
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const cat = data.category || "Raros";
                    if (!newData[cat]) newData[cat] = [];
                    newData[cat].push({
                        id: docSnap.id,
                        ...data
                    });
                });

                window.currentData = newData;
                if (typeof window.renderList === 'function') {
                    window.renderList();
                }
            }, (error) => {
                console.error("Erro no Firebase: ", error);
            });
        }

        listenToFirebase();
    </script>

    <style>
        /* Estilo para Pixel Art nítida */
        .pokemon-sprite {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Animação da Aura tipo Dragon Ball */
        @keyframes dbzAura {
            0% { box-shadow: 0 0 10px 2px rgba(52, 211, 153, 0.6), 0 0 20px 4px rgba(52, 211, 153, 0.4); }
            50% { box-shadow: 0 0 25px 8px rgba(52, 211, 153, 0.9), 0 0 40px 12px rgba(52, 211, 153, 0.7); }
            100% { box-shadow: 0 0 10px 2px rgba(52, 211, 153, 0.6), 0 0 20px 4px rgba(52, 211, 153, 0.4); }
        }

        @keyframes dbzAuraRose {
            0% { box-shadow: 0 0 10px 2px rgba(244, 63, 94, 0.6), 0 0 20px 4px rgba(244, 63, 94, 0.4); }
            50% { box-shadow: 0 0 25px 8px rgba(244, 63, 94, 0.9), 0 0 40px 12px rgba(244, 63, 94, 0.7); }
            100% { box-shadow: 0 0 10px 2px rgba(244, 63, 94, 0.6), 0 0 20px 4px rgba(244, 63, 94, 0.4); }
        }

        /* Classe que aplica a aura */
        .aura-effect {
            position: relative;
            border-radius: 9999px; /* Mantém a aura redonda */
            animation: dbzAura 1.5s infinite ease-in-out;
            border: 2px solid rgba(52, 211, 153, 0.8); /* Borda brilhante básica */
        }

        .aura-effect-rose {
            position: relative;
            border-radius: 9999px;
            animation: dbzAuraRose 1.5s infinite ease-in-out;
            border: 2px solid rgba(244, 63, 94, 0.8);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-rose-500 selection:text-white">

            <!-- Esquerda: Título + Treinadores -->
            <div class="flex flex-wrap items-center gap-4">

                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent whitespace-nowrap">

                <!-- Treinadores com efeito de Aura -->

                        <div class="w-10 h-10 rounded-full overflow-hidden p-0.5 aura-effect-rose bg-black flex items-center justify-center">
                            <!-- Link Corrigido: ./ procura na mesma pasta do index.html -->

                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-emerald-400 leading-none">Dragon Pink</span>
                            <span class="text-[9px] text-slate-400 flex items-center gap-1 mt-0.5">
                                <i class="fa-solid fa-baseball text-[7px] text-orange-400"></i> Trainer
                            </span>
                        </div>
                    </div>

                    <!-- Doomsday -->
                    <div class="flex items-center gap-2 bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 shadow-inner">
                        <div class="w-10 h-10 rounded-full overflow-hidden p-0.5 aura-effect bg-black flex items-center justify-center">
                            <img src="./Doomsday.gif" alt="Doomsday" class="w-full h-full object-contain pokemon-sprite">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-rose-500 leading-none">Doomsday</span>
                            <span class="text-[9px] text-slate-400 flex items-center gap-1 mt-0.5">
                                <i class="fa-solid fa-baseball text-[7px] text-orange-400"></i> Trainer

                    </div>

                    <!-- Toure Diamond -->
                    <div class="flex items-center gap-2 bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 shadow-inner">
                        <div class="w-10 h-10 rounded-full overflow-hidden p-0.5 aura-effect bg-black flex items-center justify-center">
                            <img src="./Toure Diamond.gif" alt="Toure Diamond" class="w-full h-full object-contain pokemon-sprite">
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-emerald-400 leading-none">Toure Diamond</span>
                            <span class="text-[9px] text-slate-400 flex items-center gap-1 mt-0.5">
                                <i class="fa-solid fa-baseball text-[7px] text-orange-400"></i> Trainer
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Direita: Botões (Mantidos os originais) -->
            <div class="flex items-center gap-2 shrink-0">
                <button onclick="requestAdminAuth(() => openAutoModal())" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-md shadow-indigo-600/20 cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Importação Automática
                </button>
                <button onclick="requestAdminAuth(() => openAddModal())" class="bg-rose-600 hover:bg-rose-500 text-white px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-md shadow-rose-600/20 cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i> Novo Pokémon
                </button>
                <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 border border-slate-700 cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-download"></i> Exportar
                </button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 border border-slate-700 cursor-pointer whitespace-nowrap">
                    <i class="fa-solid fa-upload"></i> Importar
                    <input type="file" id="importFile" accept=".json" onchange="requestAdminAuth(() => importData(event))" class="hidden">
                </label>
                <button onclick="requestAdminAuth(() => resetToDefault())" class="bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 px-2.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 border border-rose-900/50 cursor-pointer" title="Limpar Nuvem">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content (Mantenha o resto do seu ficheiro igual daqui para baixo) -->

</html>
